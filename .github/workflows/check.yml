name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # macOS and Linux are both supported. The Linux column reports without blocking until it has been
    # green on a push, then this line goes.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # pinned rather than read from package.json so a runner and a laptop disagree only
          # when someone means them to; engines.bun there is the floor for humans
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # typecheck + biome + tests + bridge size gate; the daemon tests run real git in temp repos
      - run: bun run check

  # The package a stranger installs, driven the way they drive it: node and npm, no bun on PATH,
  # the tarball from `npm pack`, every verb through the shim. The Linux column reports rather than
  # blocks until it has been green once.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # what Claude Code's sandbox needs on Linux; `toyon doctor` fails without them, on purpose
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat
      - run: bun install --frozen-lockfile
      - run: bun run pack
      - run: cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP"
      - name: install the tarball into an empty project and drive it with bun off PATH
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/toyon-*.tgz
          export PATH="/usr/bin:/bin:$(dirname "$(which node)")"
          npx toyon --version
          npx toyon
          npx toyon doctor
          npx toyon stop
          npx toyon logs -n 40
