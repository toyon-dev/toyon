name: image

# The toyon machine image, for hosts other than Fly (Railway, Render, a box with Docker): the same
# build context `toyon deploy fly` builds in a person's own Fly builder, built here from a release tag
# and published to GitHub's registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run pack
      # prints BUN_VERSION=<the CLI's bun>, kept for the build argument below
      - run: bun scripts/machine-context.ts "$RUNNER_TEMP/machine" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/machine
          push: true
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/toyon:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/toyon:latest
