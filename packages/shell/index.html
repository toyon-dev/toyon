<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout viewport rather than sliding a
         visual one over it, so the chat's own bottom pinning keeps the newest row above the box.
         viewport-fit=cover is what gives env(safe-area-inset-*) a value on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- the bar a phone or an installed window draws above the page: the dark theme's header
         ground, the same literal as the manifest's, which is all some browsers ever read -->
    <meta name="theme-color" content="#3d3835" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Toyon</title>
    <!-- The ground, before the first paint: the bundle that applies the theme is a module, and a
         module runs after the browser has already painted its own white canvas. The last theme's
         ground is read here, where it still blocks that paint; the literal is the dark theme's,
         for a first visit. The rule names the token, so it follows every theme applied later. -->
    <style>
      html {
        background: var(--surface0, #32302d);
        color-scheme: dark;
      }
    </style>
    <script>
      try {
        const t = JSON.parse(localStorage.getItem("toyon-theme"));
        if (typeof t?.colors?.surface0 === "string") {
          document.documentElement.style.setProperty("--surface0", t.colors.surface0);
          document.documentElement.style.colorScheme = t.kind;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The daemon's hello, asked for while the bundle is still loading: the page's own code
      // starts hundreds of milliseconds after this line on a cold cache, and it should start
      // knowing the project rather than painting a placeholder and correcting it. The token is
      // where ws.ts will look for it: the fragment on a fresh link, storage on every load after.
      // Nothing here is trusted beyond the first paint; the socket's own hello replaces it.
      //
      // A phone that scanned a pairing code arrives with `#pair=` instead. The code is traded for
      // the token before anything else, and the phone goes on to add this machine to toyon.cloud,
      // which is where it opens from after that. The fragment leaves the address first, so a
      // reload never spends the code twice; a spent code falls through to whatever token the
      // phone already holds, and without one the page says how to get a new code.
      window.toyonBoot = (() => {
        const hello = () => {
          const token = (location.hash.match(/token=([a-f0-9]+)/) || [])[1] || localStorage.getItem("toyon-token");
          if (!token) return Promise.resolve(null);
          return fetch(`/bootstrap?token=${token}`)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        };
        try {
          const code = (location.hash.match(/pair=([A-Za-z0-9_-]+)/) || [])[1];
          if (!code) return hello();
          history.replaceState(null, "", location.pathname + location.search);
          return fetch("/pair/redeem", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ code }),
          })
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null)
            .then((paired) => {
              if (!paired?.token) return hello();
              localStorage.setItem("toyon-token", paired.token);
              location.replace(`https://toyon.cloud/#add=${encodeURIComponent(location.origin)}`);
              // nothing paints while the page is leaving
              return new Promise(() => {});
            });
        } catch {
          return Promise.resolve(null);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
