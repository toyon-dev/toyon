<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout viewport rather than sliding a
         visual one over it, so the chat's own bottom pinning keeps the newest row above the box.
         viewport-fit=cover is what gives env(safe-area-inset-*) a value on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#32302d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Toyon</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The daemon's hello, asked for while the bundle is still loading: the page's own code
      // starts hundreds of milliseconds after this line on a cold cache, and it should start
      // knowing the project rather than painting a placeholder and correcting it. The token is
      // where ws.ts will look for it: the fragment on a fresh link, storage on every load after.
      // Nothing here is trusted beyond the first paint; the socket's own hello replaces it.
      window.toyonBoot = (() => {
        try {
          const token = (location.hash.match(/token=([a-f0-9]+)/) || [])[1] || localStorage.getItem("toyon-token");
          if (!token) return Promise.resolve(null);
          return fetch(`/bootstrap?token=${token}`)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        } catch {
          return Promise.resolve(null);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
