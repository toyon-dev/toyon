<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout viewport rather than sliding a
         visual one over it, so the chat's own bottom pinning keeps the newest row above the box.
         viewport-fit=cover is what gives env(safe-area-inset-*) a value on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- what a phone or an installed window paints above the page, before the bundle sets it for
         the screen (theme.ts): the ground of the phone's list, which a fresh tab opens on, the
         same literal as the manifest's, and the dark theme's bar ground for a desk window's
         caption area. Some installed apps read only this and the manifest (Firefox on Android),
         so the literal is the list's answer and not the dark theme's canvas. -->
    <meta name="theme-color" content="#3d3835" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Toyon</title>
    <!-- The canvas, for a first visit when the script under it cannot paint: the rule names the
         token, so it follows every theme applied later, and the literal is the dark theme's. In the
         base layer, where the bundle's own canvas rule lives (base.css): unlayered it would beat
         the one that follows the screen's ground, and the html's canvas would stay surface0 under
         a list standing on surface1. -->
    <style>
      @layer tokens, base, surfaces;
      @layer base {
        html {
          background: var(--surface0, #32302d);
          color-scheme: dark;
        }
        /* The wait for the bundle, marked: the four cells the transcript's composing mark draws
           (ui/spinner.css), drawn again here because the bundle that owns them is what is being
           waited for. Centred, where a phone's splash icon just was, in the cached theme's quiet
           ink. Shown only once the wait is worth marking: a warm load is done inside the delay and
           never flashes it. The bundle takes it down once a screen stands (main.tsx). */
        #boot {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          pointer-events: none;
          color: var(--boot-ink, #9e927e);
          opacity: 0;
          animation: boot-show 0s 400ms forwards;
        }
        #boot > span {
          position: relative;
          width: 13px;
          height: 13px;
        }
        #boot > span > span {
          position: absolute;
          width: 5px;
          height: 5px;
          background: currentColor;
          opacity: 0.25;
          animation: boot-squares 0.48s steps(1) infinite;
        }
        #boot > span > span:nth-child(1) {
          left: 1px;
          top: 1px;
          animation-delay: -0.12s;
        }
        #boot > span > span:nth-child(2) {
          left: 7px;
          top: 1px;
          animation-delay: 0s;
        }
        #boot > span > span:nth-child(3) {
          left: 7px;
          top: 7px;
          animation-delay: -0.36s;
        }
        #boot > span > span:nth-child(4) {
          left: 1px;
          top: 7px;
          animation-delay: -0.24s;
        }
        @keyframes boot-show {
          to {
            opacity: 1;
          }
        }
        @keyframes boot-squares {
          0% {
            opacity: 1;
          }
          25% {
            opacity: 0.5;
          }
          50%,
          75% {
            opacity: 0.25;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot > span > span {
            animation: none;
          }
          #boot > span > span:first-child {
            opacity: 1;
          }
        }
      }
    </style>
    <script>
      // The ground of the screen this tab opens on, painted here, where it still blocks the first
      // paint: the bundle that applies the theme is a module, and a module runs after the browser
      // has painted its own white canvas. The theme is the last one applied, from its cache, and
      // the screen is the one this tab was reading, or on a fresh tab the phone's list, which
      // stands on surface1 where the desk and a worktree's chat stand on surface0. The frame query
      // is the shell's own (app/phone.ts), and the bundle lifts this ground once a screen stands
      // (main.tsx). The literals are the dark theme's, for a first visit.
      try {
        const t = JSON.parse(localStorage.getItem("toyon-theme"));
        const colors =
          typeof t?.colors?.surface0 === "string" ? t.colors : { surface0: "#32302d", surface1: "#3d3835" };
        const phone = matchMedia("(max-width: 640px), ((hover: none) and (max-width: 1000px))").matches;
        const key = sessionStorage.getItem("toyon-ground") || (phone ? "surface1" : "surface0");
        document.documentElement.style.background = colors[key] || colors.surface0;
        document.documentElement.style.setProperty("--boot-ink", colors.text1 || "#9e927e");
        if (t?.kind) document.documentElement.style.colorScheme = t.kind;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><span><span></span><span></span><span></span><span></span></span></div>
    <script>
      // The daemon's hello, asked for while the bundle is still loading: the page's own code
      // starts hundreds of milliseconds after this line on a cold cache, and it should start
      // knowing the project rather than painting a placeholder and correcting it. The token is
      // where ws.ts will look for it: the fragment on a fresh link, storage on every load after.
      // Nothing here is trusted beyond the first paint; the socket's own hello replaces it. A
      // device with no token at all gets null, and the bundle asks to be let in.
      window.toyonBoot = (() => {
        try {
          const token = (location.hash.match(/token=([a-f0-9]+)/) || [])[1] || localStorage.getItem("toyon-token");
          if (!token) return Promise.resolve(null);
          return fetch(`/bootstrap?token=${token}`)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        } catch {
          return Promise.resolve(null);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
